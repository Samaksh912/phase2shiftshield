services:
  - type: web
    name: shiftshield-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        value: https://shiftshield-ml.onrender.com
      - key: SUPABASE_URL
        value: https://ntwgaooqahukkngtszzd.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://phase2guidewire.vercel.app
      - key: TWILIO_ACCOUNT_SID
        sync: false

  - type: web
    name: shiftshield-ml
    runtime: python
    rootDir: backend/ml-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
