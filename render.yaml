services:
  - type: web
    name: shiftshield-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # ML_SERVICE_URL no longer needed — ML is now inline (see ml-client.js + ml-inline.js)
      # - key: ML_SERVICE_URL
      #   value: https://shiftshield-ml.onrender.com
      # Backend URL: https://shiftshield-backend-5umk.onrender.com
      - key: SUPABASE_URL
        value: https://ntwgaooqahukkngtszzd.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://phase2guidewire.vercel.app,http://localhost:53711,http://localhost:8080,http://localhost:3000,http://127.0.0.1:53711,http://127.0.0.1:8080
      - key: TWILIO_ACCOUNT_SID
        sync: false

  # ── ML service (decommissioned — now runs inline in the backend) ────────────
  # Kept here for reference. To restore as a separate service:
  # 1. Uncomment this block
  # 2. Uncomment ML_SERVICE_URL above
  # 3. Revert ml-client.js to the HTTP client
  #
  # - type: web
  #   name: shiftshield-ml
  #   runtime: python
  #   rootDir: backend/ml-service
  #   plan: free
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  #   healthCheckPath: /health
  #   autoDeployTrigger: commit
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: 3.12.4
